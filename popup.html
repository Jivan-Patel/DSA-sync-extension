<!DOCTYPE html>
<html>
<head>
    <title>DSA Sync</title>
    <style>
        body { width: 300px; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        h2 { margin-top: 0; color: #333; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #2ea44f; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2c974b; }
        .status { margin-top: 10px; font-size: 0.9em; color: #666; text-align: center; }
    </style>
</head>
<body>
    <h2>DSA Sync Config</h2>
    <input type="password" id="ghToken" placeholder="GitHub Personal Access Token" />
    <input type="text" id="repoName" placeholder="Owner/Repo (e.g., Jivan-Patel/DSA-Journey)" />
    <button id="saveBtn">Save Configuration</button>
    <div class="status" id="status"></div>
    <script src="popup.js"></script>
</body>
</html>
